# E2E stack for Playwright (TESTING §3.3). Applied on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up --build -d --wait
# or, from e2e/: npm run stack:up / npm run stack:down
#
# Differences from the development stack:
# - own project name, so containers, network and images do not mix with the dev stack;
# - database in memory (tmpfs): every start begins with an empty database, nothing persists;
# - stack-local network instead of the external dokploy-network (CI has none);
# - every e-mail goes to Mailpit (S5-11), so none can leave an E2E run; its API on
#   http://localhost:8025 lets a test read a mail (from S5-14);
# - the test release folders mounted read-only, so the API seeds and activates T.1 at startup
#   (S4-08, #241; catalog part of the seeder of TESTING §6.3, Development/E2E only);
# - client healthcheck on nginx and on the API's /health/ready, so --wait returns only when the
#   client answers and the API reaches its database;
# - relaxed rate limits of the anonymous export and of CriteriaListShown (SPEC §7.3, S4-21a): every
#   test of a run comes from the same address, so the 30 per 10 minutes of production would fail
#   the run, not test it. The limit itself is checked by the .NET integration tests (API-05).
#
# The E2E stack publishes the same host ports 5000 and 4200 as the dev stack (docker-compose.yml):
# stop one before starting the other.
#
# Not yet here (TESTING §3.3, §6.3; later migration steps): an E2E environment of its own, the
# users and products of the seeder and the test clock endpoint. Until then the API runs as
# Development, like the dev stack.
name: procureaccess-e2e

services:
  db:
    container_name: !reset null
    ports: !reset []
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql/data

  # SMTP catcher (S5-11, ARCHITECTURE C71, TESTING §3.3): every e-mail of the stack lands here and
  # nowhere else. MIT, development tool, never shipped; same image as the integration tests
  # (EmailDeliveryTests.MailpitContainer.Image) — change them together.
  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    ports:
      - "127.0.0.1:8025:8025"

  api:
    depends_on:
      mailpit:
        condition: service_started
    environment:
      # Mail to Mailpit, without TLS or sign-in (Development and E2E only, S5-11), with links to the client
      Email__Smtp__Host: mailpit
      Email__Smtp__Port: "1025"
      Email__Smtp__Security: None
      Email__Smtp__Username: ""
      Email__Smtp__Password: ""
      App__BaseUrl: http://localhost:4200
      # Active test release T.1 (MiniCatalog), seeded at startup in Development/E2E only (S4-08, #241)
      Catalog__TestRelease__Path: /app/catalog/test-releases
      Catalog__TestRelease__Version: T.1
      # Relaxed rate limits (S4-21a): all tests share one client address
      RateLimits__AnonymousExport__PermitLimit: "10000"
      RateLimits__CriteriaListShown__PermitLimit: "10000"
    volumes:
      - ./tests/ProcureAccess.Tests.Shared/Fixtures/Releases:/app/catalog/test-releases:ro

  client:
    healthcheck:
      # 127.0.0.1, not localhost: in the Alpine image localhost resolves to ::1 first, and nginx listens on IPv4 only.
      # The API is asked directly over the stack network: nginx forwards only /api/, and /health/ready
      # stays off the public client origin (#112). The aspnet image has no wget for a check of its own.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ && wget -q -O /dev/null http://api:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

networks:
  dokploy-network:
    external: false
