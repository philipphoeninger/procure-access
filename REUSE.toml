# SPDX-FileCopyrightText: 2026 Blinden- und Sehbehindertenverein Hamburg e.V.
# SPDX-License-Identifier: MIT
#
# Licence information for files that cannot carry an SPDX comment header
# (JSON, binaries, Markdown documents, generated files). Source files carry
# their own header. Check with `reuse lint` (https://reuse.software).

version = 1

# Project documents, README files and AI onboarding.
[[annotations]]
path = ["docs/**", "**/README.md", "CLAUDE.md", "components/notes.txt", "**/todo.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Blinden- und Sehbehindertenverein Hamburg e.V."
SPDX-License-Identifier = "MIT"

# Criteria catalog documents: the project team's own sections (filter layers,
# exclusions, rating scale) are MIT; the BIT inklusiv texts they quote verbatim,
# used with permission of Detlef Girke (see the document header), are not.
# The gap list of a release quotes the BIT inklusiv titles (S3-27).
[[annotations]]
path = ["docs/kriterienkatalog_bit_inklusiv_v1*.md", "docs/kriterienkatalog_*_luecken_v*.md"]
precedence = "override"
SPDX-FileCopyrightText = ["BIT inklusiv", "2026 Blinden- und Sehbehindertenverein Hamburg e.V."]
SPDX-License-Identifier = "MIT AND LicenseRef-AllRightsReserved"

# JSON configuration, translations and other files without comment syntax.
[[annotations]]
path = [
  "**/*.json",
  "**/*.sln",
  "**/*.csproj.user",
  "**/.nvmrc",
  "CLIENT/CLIENT.ProcureAccess/public/products.csv",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Blinden- und Sehbehindertenverein Hamburg e.V."
SPDX-License-Identifier = "MIT"

# E-mail templates: sent as raw HTML, so a header comment would end up in
# every e-mail.
[[annotations]]
path = "DAL/MODELS.ProcureAccess/EmailTemplates/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Blinden- und Sehbehindertenverein Hamburg e.V."
SPDX-License-Identifier = "MIT"

# Generated files: EF Core migrations.
[[annotations]]
path = [
  "DAL/DAL.ProcureAccess/Migrations/**",
  "src/ProcureAccess.Modules.*/Persistence/Migrations/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Blinden- und Sehbehindertenverein Hamburg e.V."
SPDX-License-Identifier = "MIT"

# BIT inklusiv texts outside the criteria catalog documents: the migrations
# that carry the criteria seed data (EF Core repeats it in every designer file
# and in the model snapshot, so new migrations are covered by the glob), the
# catalog migrations that carry the product-part explanations of the filter-value
# seed (quoted from the Standardanforderungskatalog; S3-11 P8, S3-13), the
# catalog release data (SPEC SD20) and the CAT-10 fixture, which quotes the
# criterion names of the seed (#242). The code is MIT, the quoted texts are not.
# The seed data itself (SeedData/CriteronSeed.cs, Persistence/Seed/FilterValueSeed.cs)
# carries the same in its header.
# Must stay below the migrations and JSON blocks: the last matching block wins.
[[annotations]]
path = [
  "DAL/DAL.ProcureAccess/Migrations/*_AddSeedData.cs",
  "DAL/DAL.ProcureAccess/Migrations/*.Designer.cs",
  "DAL/DAL.ProcureAccess/Migrations/ApplicationDBContextModelSnapshot.cs",
  "src/ProcureAccess.Modules.Catalog/Persistence/Migrations/*_AddFilterDimensions.cs",
  "src/ProcureAccess.Modules.Catalog/Persistence/Migrations/*.Designer.cs",
  "src/ProcureAccess.Modules.Catalog/Persistence/Migrations/CatalogDbContextModelSnapshot.cs",
  "catalog/releases/**",
  "tests/ProcureAccess.Tests.Integration/Catalog/Fixtures/cat-10-criteria-filter.json",
]
precedence = "override"
SPDX-FileCopyrightText = ["BIT inklusiv", "2026 Blinden- und Sehbehindertenverein Hamburg e.V."]
SPDX-License-Identifier = "MIT AND LicenseRef-AllRightsReserved"

# Shared IDE settings (Rider/IntelliJ); the IDE rewrites these files.
[[annotations]]
path = ".idea/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Blinden- und Sehbehindertenverein Hamburg e.V."
SPDX-License-Identifier = "MIT"

# Files of the blocks above that already existed in 2025 (git history): same
# licence, copyright years 2025-2026. A fixed list; new files never go here.
# Must stay below the MIT blocks above: the last matching block wins.
[[annotations]]
path = [
  "API/API.ProcureAccess/API.ProcureAccess.csproj.user",
  "API/API.ProcureAccess/Properties/launchSettings.json",
  "API/API.ProcureAccess/appsettings.Development.json",
  "API/API.ProcureAccess/appsettings.Production.json",
  "API/API.ProcureAccess/appsettings.json",
  "CLIENT/CLIENT.ProcureAccess/.nvmrc",
  "CLIENT/CLIENT.ProcureAccess/.vscode/extensions.json",
  "CLIENT/CLIENT.ProcureAccess/.vscode/launch.json",
  "CLIENT/CLIENT.ProcureAccess/.vscode/tasks.json",
  "CLIENT/CLIENT.ProcureAccess/README.md",
  "CLIENT/CLIENT.ProcureAccess/angular.json",
  "CLIENT/CLIENT.ProcureAccess/package-lock.json",
  "CLIENT/CLIENT.ProcureAccess/package.json",
  "CLIENT/CLIENT.ProcureAccess/public/products.csv",
  "CLIENT/CLIENT.ProcureAccess/src/app/core/utils/todo.txt",
  "CLIENT/CLIENT.ProcureAccess/src/app/features/feature-1/**/todo.txt",
  "CLIENT/CLIENT.ProcureAccess/src/app/layout/sidebar/todo.txt",
  "CLIENT/CLIENT.ProcureAccess/src/app/shared/directives/todo.txt",
  "CLIENT/CLIENT.ProcureAccess/src/app/shared/pipes/todo.txt",
  "CLIENT/CLIENT.ProcureAccess/tsconfig.app.json",
  "CLIENT/CLIENT.ProcureAccess/tsconfig.json",
  "CLIENT/CLIENT.ProcureAccess/tsconfig.spec.json",
  "README.md",
  "components/notes.txt",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025-2026 Blinden- und Sehbehindertenverein Hamburg e.V."
SPDX-License-Identifier = "MIT"

# WERTE.IT logo: created by a designer of the project WERTE.IT; the legal
# rights holder is BSVH. Not MIT. Name new images explicitly with their own
# owner and licence (no glob), so that reuse lint flags any image that has none.
[[annotations]]
path = "CLIENT/CLIENT.ProcureAccess/public/werte_it_logo.jpg"
precedence = "override"
SPDX-FileCopyrightText = "2025 Blinden- und Sehbehindertenverein Hamburg e.V."
SPDX-License-Identifier = "LicenseRef-AllRightsReserved"

# Favicon: the unchanged default icon of the Angular CLI (Angular licence).
[[annotations]]
path = "CLIENT/CLIENT.ProcureAccess/public/favicon.ico"
precedence = "override"
SPDX-FileCopyrightText = "2010-2025 Google LLC (https://angular.dev/license)"
SPDX-License-Identifier = "MIT"

# Material Symbols Outlined (#135, S3-25): the font of the material-symbols package
# (Google, Apache-2.0), cut down to the icons of material-symbols-icons.json by
# scripts/subset-material-symbols.py, i.e. changed. The client image also lists it
# in /3rdpartylicenses.txt (CLIENT Dockerfile).
[[annotations]]
path = "CLIENT/CLIENT.ProcureAccess/src/assets/fonts/material-symbols-outlined.woff2"
precedence = "override"
SPDX-FileCopyrightText = "2026 Google LLC"
SPDX-License-Identifier = "Apache-2.0"

# Licence notices of the API image (#187, S4-27): THIRD-PARTY-NOTICES.txt is generated by
# scripts/check-api-notices.mjs from the shipped NuGet packages; scripts/api-notices/ holds the
# texts it cannot take from a package (the Npgsql licences, the notices of the swagger-ui code
# that Swashbuckle embeds). The project's own framing is MIT; the licence texts and notices they
# quote verbatim, as those licences require, belong to the holders named in them and stay under
# the licence each one states.
[[annotations]]
path = ["API/API.ProcureAccess/THIRD-PARTY-NOTICES.txt", "scripts/api-notices/*.txt"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 Blinden- und Sehbehindertenverein Hamburg e.V.", "The copyright holders named in the file"]
SPDX-License-Identifier = "MIT"
