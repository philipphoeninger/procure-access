# Secrets and settings come from .env (copy .env.example to .env and fill it in).
# ${VAR:?...} stops docker-compose with an error if a required variable is missing.
services:
  db:
    image: postgres:17-alpine
    container_name: procureaccess-db
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    #user: "0:0"
    ports:
      # Host loopback only: Docker port publishing bypasses host firewalls such as ufw, and the
      # API reaches the database over the compose network. Use an SSH tunnel for remote access.
      - "127.0.0.1:${DB_PORT_OUTER:-5432}:${DB_PORT_INNER:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      #- ./DB/init/01-create-db.sql:/docker-entrypoint-initdb.d/init.sql
      #- ./DB/init:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dokploy-network

  api:
    build:
      context: .
      dockerfile: ./API/API.ProcureAccess/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      # From .env; Development if unset. Sample data (RebuildDatabase) runs only in Development (SEC-06).
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__ProcureAccess: "Host=${DB_HOST:-db};Port=${DB_PORT_INNER:-5432};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"
      JWTSettings__Key: ${JWT_KEY:?set JWT_KEY in .env}
      Email__Username: ${SMTP_USERNAME:-}
      Email__Password: ${SMTP_PASSWORD:-}
      # Sample user for the local stack; empty = no sample user (only used in Development)
      SampleData__UserPassword: ${SAMPLE_USER_PASSWORD:-}
    ports:
      - 5000:8080
    # volumes:
    #   - ./API/API.ProcureAccess:/src
    networks:
      - dokploy-network
    restart: on-failure

  client:
    build:
      context: ./CLIENT/CLIENT.ProcureAccess
      dockerfile: Dockerfile
      args:
        # Angular build configuration: "production" (Dokploy) or "production,local" (local stack)
        NG_CONFIGURATION: ${CLIENT_BUILD_CONFIGURATION:?set CLIENT_BUILD_CONFIGURATION in .env}
    depends_on:
      - api
    ports:
      - 4200:80
    # volumes:
    #   - ./:/app
        # - ./CLIENT/CLIENT.ProcureAccess:/app
        # - /app/node_modules
    # command: npm run start
    # environment:
    #   - CHOKIDAR_USEPOLLING=true
    #   - WATCHPACK_POLLING=true
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  postgres_data:
