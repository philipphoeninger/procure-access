# Access log without the query string: refresh and e-mail confirmation tokens travel there,
# and the container log (stdout) must not hold them. Otherwise like nginx's "main" format.
log_format no_query '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;

    server_name localhost;

    access_log /var/log/nginx/access.log no_query;

    root /usr/share/nginx/html;
    index index.html;

    # Compress the bundle, styles and translations (text/html is always included).
    # gzip_proxied any: also when a reverse proxy in front (Dokploy) forwards the request.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Angular routing. index.html and unhashed files are revalidated on every
    # load, so a redeploy is picked up without a hard reload.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Translations and assets are files, never routes: a missing one is a 404, not index.html.
    location ^~ /i18n/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ^~ /assets/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Files with a content hash in their name (release build, outputHashing "all")
    # never change. A missing one is a 404, not index.html.
    location ~ "-[A-Z0-9]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ^~ /media/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API proxy (the API container listens on 8080). The client calls the API on this
    # origin (apiUrl "/api"). API responses stay uncompressed, as before.
    # The upstream is a variable, so nginx resolves "api" through Docker's DNS at request
    # time (cached 10 s): a redeployed API container with a new IP is found without
    # restarting the client. Without a URI part, the request URI is passed on unchanged.
    location ^~ /api/ {
        gzip off;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
