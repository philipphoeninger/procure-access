server {
    listen 80;

    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compress the bundle, styles and translations (text/html is always included).
    # gzip_proxied any: also when a reverse proxy in front (Dokploy) forwards the request.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Angular routing. index.html and unhashed files are revalidated on every
    # load, so a redeploy is picked up without a hard reload.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Translations and assets are files, never routes: a missing one is a 404, not index.html.
    location ^~ /i18n/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ^~ /assets/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Files with a content hash in their name (release build, outputHashing "all")
    # never change. A missing one is a 404, not index.html.
    location ~ "-[A-Z0-9]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ^~ /media/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API proxy (the API container listens on 8080). The client calls the API on this
    # origin (apiUrl "/api"). API responses stay uncompressed, as before.
    location ^~ /api/ {
        gzip off;
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
