<header class="pa-header">
  <a class="pa-header__brand" routerLink="/">
    <span class="pa-header__name">{{ 'shell.appName' | translate }}</span>
    @if (wide()) {
      <!-- &ngsp; keeps a space between name and claim in the link's accessible name -->
      &ngsp;<span class="pa-header__claim">{{ 'shell.appClaim' | translate }}</span>
    }
  </a>

  @if (wide()) {
    <pa-main-nav layout="bar" />
  } @else {
    <!-- pa-app-header-compact: the navigation opens in the shell's mat-sidenav (Handoff §2.2) -->
    <button matButton class="pa-header__menu" type="button"
      aria-controls="main-nav" [attr.aria-expanded]="menuOpen()"
      (click)="menuToggle.emit()">{{ 'shell.nav.menu' | translate }}</button>
  }
</header>
