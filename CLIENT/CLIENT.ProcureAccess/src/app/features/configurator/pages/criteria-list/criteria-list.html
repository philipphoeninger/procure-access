<h1 class="pa-criteria-list__title">{{ 'criteria.list.title' | translate }}</h1>
<div>
  <a matButton="outlined" [routerLink]="configuratorPath">{{ 'criteria.list.changeSelection' | translate }}</a>
</div>

@if (loaded()) {
  <ul class="pa-criteria-list__items">
    @for (criterion of criteria(); track criterion.key) {
      <li>
        <pa-criterion-card
          [criterion]="criterion"
          [decision]="decision(criterion.key)"
          [names]="names()"
          (includedChange)="store.setCriterionIncluded(criterion.key, $event)"
          (levelChange)="store.overrideCriterionPriority(criterion.key, $event)"
          (weightChange)="store.setCriterionWeight(criterion.key, $event)"
          (priorityReset)="store.resetCriterionPriority(criterion.key)"
          (noteChange)="store.setCriterionNote(criterion.key, $event)"
        />
      </li>
    }
  </ul>
}
