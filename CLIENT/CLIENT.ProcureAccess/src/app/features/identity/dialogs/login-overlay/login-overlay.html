<h2 mat-dialog-title>{{ 'shell.session.expired.title' | translate }}</h2>

<mat-dialog-content class="pa-login-overlay">
  <p class="pa-login-overlay__body">{{ 'shell.session.expired.body' | translate }}</p>

  <pa-login-form idPrefix="pa-login-overlay" formLayout="dialog" (signedIn)="signedIn()">

  </pa-login-form>
</mat-dialog-content>
