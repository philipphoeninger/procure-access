#
# Version updates (TESTING §8.2 stage 9; issue #116). Security alerts and security
# updates are switched on in the repository settings and do not depend on this file.
#
# Groups keep the number of pull requests small for a single maintainer. Every pull
# request runs the full CI; check the licence of new versions (CLAUDE §10) before merging.

version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, .NET]
    groups:
      dotnet:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # v14 is the last MIT version; v15+ is RPL/commercial. Replaced in step 1 (#31).
      - dependency-name: AutoMapper
      # Comes with ClosedXML (S4-20b), which accepts [1.0.0, 3.0.0); NuGet resolves 1.0.0
      # (Apache-2.0). 2.0+ is under the Six Labors Split License, which fails D12.
      - dependency-name: SixLabors.Fonts
        versions: [">= 2.0.0"]
      # .NET stays on the LTS line (ADR-013); a new major is a migration, not an update.
      - dependency-name: "Microsoft.*"
        update-types: [version-update:semver-major]
      - dependency-name: "Npgsql*"
        update-types: [version-update:semver-major]
      - dependency-name: "System.*"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /CLIENT/CLIENT.ProcureAccess
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    groups:
      # Angular packages must stay on one version; majors go through `ng update`.
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "angular-eslint", "@angular-eslint/*"]
        update-types: [minor, patch]
      # vitest and @vitest/coverage-v8 must be bumped together (#98).
      vitest:
        patterns: ["vitest", "@vitest/*"]
      other:
        patterns: ["*"]
        exclude-patterns: ["@angular/*", "@angular-devkit/*", "angular-eslint", "@angular-eslint/*", "vitest", "@vitest/*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@angular/*"
        update-types: [version-update:semver-major]
      - dependency-name: "@angular-devkit/*"
        update-types: [version-update:semver-major]
      # The TypeScript version is set by the Angular release.
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    # A pull request that changes @playwright/test fails CI until e2e/playwright-image/Dockerfile
    # names the same version with its digest: push that change onto the pull request (S4-01b).
    groups:
      e2e:
        patterns: ["*"]
    ignore:
      # Follows the Node major in the .nvmrc files, which is updated by hand (CLAUDE §3).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # Same TypeScript version as the client, where the Angular release sets it (O-S3-1).
      # When `ng update` raises the client's TypeScript, raise it here in the same pull request.
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/API/API.ProcureAccess, /CLIENT/CLIENT.ProcureAccess]
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    # nginx (client image) stays on the stable branch, whose minor version is even (S3-01):
    # merge a pull request to an even minor (1.32, 1.34 …), close one to an odd minor
    # (mainline); closing makes Dependabot skip that version. A minor tag (`1.30-alpine`)
    # already pulls every patch of its branch.
    ignore:
      # The Node version lives in the client Dockerfile and both .nvmrc files and is
      # updated by hand in one commit (CLAUDE §3).
      - dependency-name: node
      # .NET stays on the LTS line; the 10.0 tags already pull the latest patch.
      - dependency-name: "dotnet/*"
        update-types: [version-update:semver-major]
