# CI pipeline, stages 1–8 of TESTING §8.2 (ARCHITECTURE §10.3). Stage 9 is codeql.yml (CodeQL)
# and .github/dependabot.yml (Dependabot). One job per stage; the job names carry the stage
# number. Actions are pinned by commit SHA (public repository); the comment names the release.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only superseded PR runs are cancelled; every merge commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: 10.0.x
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NG_CLI_ANALYTICS: false
  CI: true
  REUSE_VERSION: 6.2.0
  REPORTGENERATOR_VERSION: 5.5.11

jobs:
  lint:
    name: 1. Lint & licences
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # Whole solution: whitespace, code style and analyzer rules (all projects since S3-08, #118).
      # Compiler warnings (e.g. nullable) are not analyzer findings: stage 2 builds with -warnaserror.
      - name: dotnet format (whitespace, style, analyzers)
        run: |
          dotnet format whitespace ProcureAccess.sln --verify-no-changes
          dotnet format style ProcureAccess.sln --verify-no-changes
          dotnet format analyzers ProcureAccess.sln --verify-no-changes
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: CLIENT/CLIENT.ProcureAccess/.nvmrc
          cache: npm
          cache-dependency-path: |
            CLIENT/CLIENT.ProcureAccess/package-lock.json
            e2e/package-lock.json
      - name: ESLint (client templates, incl. accessibility rules)
        working-directory: CLIENT/CLIENT.ProcureAccess
        run: |
          npm ci
          npm run lint
      - name: REUSE / SPDX licence check
        run: pipx run "reuse==${REUSE_VERSION}" lint
      - name: Figma link check
        run: |
          node --test scripts/check-figma-links.test.mjs
          node scripts/check-figma-links.mjs
      - name: i18n check (de.json against the UX copy and the templates)
        run: |
          node --test scripts/check-i18n.test.mjs
          node scripts/check-i18n.mjs
      # The icon font is a subset with only the listed icons (#135, S3-25): the list must match the
      # icons the client uses, and the subset the list and the pinned material-symbols version.
      - name: Icon check (icon list and font subset)
        run: |
          node --test scripts/check-icons.test.mjs
          node scripts/check-icons.mjs
      # Only the self-test here: the gate itself runs in stage 7 (TESTING §8.3).
      - name: Invariant gate self-test
        run: node --test scripts/check-invariants.test.mjs
      # Only the self-test here: the check fails while a 🔧 placeholder is configured, so it runs
      # before a production release, not on pull requests (SPEC R-SUG-01, owner S3-21 1a).
      - name: Release check self-test
        run: node --test scripts/check-release-config.test.mjs
      # Last in the job: e2e/ is type-checked on the Node of e2e/.nvmrc, as stage 6 runs it (#107).
      # The npm cache was already restored above (both lock files).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: e2e/.nvmrc
      - name: TypeScript check (e2e)
        working-directory: e2e
        run: |
          npm ci
          npm run typecheck
      # ESLint for e2e/ and scripts/*.mjs with e2e/'s packages (#161, S3-26): the script starts
      # ESLint in the repository root, so it reaches scripts/ as well.
      - name: ESLint (e2e and scripts)
        working-directory: e2e
        run: npm run lint

  build:
    name: 2. Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # Every warning fails the build (#118); NuGet audit warnings stay warnings, so a new
      # advisory doesn't block unrelated pull requests (Dependabot reports it; owner, 2026-11-05).
      - name: Build .NET solution
        run: dotnet build ProcureAccess.sln -warnaserror -warnnotaserror:NU1901,NU1902,NU1903,NU1904
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: CLIENT/CLIENT.ProcureAccess/.nvmrc
          cache: npm
          cache-dependency-path: CLIENT/CLIENT.ProcureAccess/package-lock.json
      - name: Build Angular client (release)
        working-directory: CLIENT/CLIENT.ProcureAccess
        run: |
          npm ci
          npm run build:release

  dotnet-tests:
    name: ${{ matrix.stage }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - stage: 3. Unit (.NET)
            project: ProcureAccess.Tests.Unit
          - stage: 4. Architecture
            project: ProcureAccess.Tests.Architecture
          # Testcontainers starts postgres:17-alpine on the runner's Docker.
          - stage: 5. Integration
            project: ProcureAccess.Tests.Integration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # Coverage (coverlet.MTP) covers only the production assemblies (four legacy projects and the module
      # projects under src/); migrations excluded.
      - name: Test ${{ matrix.project }}
        run: >-
          dotnet test --project "tests/${{ matrix.project }}"
          --results-directory "coverage/${{ matrix.project }}"
          --coverlet --coverlet-output-format cobertura
          --coverlet-include "[API.ProcureAccess]*"
          --coverlet-include "[DAL.ProcureAccess]*"
          --coverlet-include "[MODELS.ProcureAccess]*"
          --coverlet-include "[SERVICES.ProcureAccess]*"
          --coverlet-include "[ProcureAccess.Modules.*]*"
          --coverlet-exclude-by-file "**/Migrations/*.cs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-${{ matrix.project }}
          path: coverage/${{ matrix.project }}/*.cobertura*.xml
          if-no-files-found: warn
          retention-days: 14

  client-tests:
    name: 3. Unit (Angular)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: CLIENT/CLIENT.ProcureAccess/.nvmrc
          cache: npm
          cache-dependency-path: CLIENT/CLIENT.ProcureAccess/package-lock.json
      - name: Vitest with coverage
        working-directory: CLIENT/CLIENT.ProcureAccess
        run: |
          npm ci
          npm run test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-client
          path: CLIENT/CLIENT.ProcureAccess/coverage/procure-access/lcov.info
          if-no-files-found: warn
          retention-days: 14

  # One job per Playwright project, in parallel; each builds and starts its own stack. No
  # `needs: build`: the stack builds its own images. The required check is the job `e2e-result`.
  e2e:
    name: 6. E2E + a11y (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chromium }
          - { project: firefox, browser: firefox }
          - { project: webkit, browser: webkit }
          - { project: mobile-chrome, browser: chromium }
          - { project: mobile-safari, browser: webkit }
    env:
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # docker-compose.yml needs a .env. Take the template and fill its two empty secrets
      # with random values for this run only (masked in the log, never uploaded).
      - name: Write .env for the E2E stack
        run: |
          cp .env.example .env
          db_password="$(openssl rand -hex 24)"
          jwt_key="$(openssl rand -base64 64 | tr -d '\n')"
          echo "::add-mask::$db_password"
          echo "::add-mask::$jwt_key"
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=${db_password}|; s|^JWT_KEY=.*|JWT_KEY=${jwt_key}|" .env
          if grep -qE "^(DB_PASSWORD|JWT_KEY)=$" .env; then echo "::error::.env still has an empty secret"; exit 1; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: e2e/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci
      - name: Read Playwright version
        id: playwright
        working-directory: e2e
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # Restore and save are separate steps, so the browsers are saved right after the install,
      # also when the tests fail later (#105).
      - name: Restore Playwright browsers
        id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      - name: Install Playwright browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        # Only the browser (Playwright's CDN, about 30 s); its apt packages come in the next step.
        timeout-minutes: 10
        working-directory: e2e
        run: npx playwright install "$BROWSER"
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Save Playwright browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}
      # The browser's apt packages, on every run. Usually 10–40 s, but a slow apt mirror (about
      # 40 kB/s) made it take more than 10 minutes on a third of the runs on main (#203). So each
      # attempt stops after 3 minutes and a second one follows: apt keeps the packages the first
      # attempt downloaded, and `dpkg --configure -a` finishes an install the stop interrupted.
      - name: Install Playwright system dependencies
        timeout-minutes: 8
        working-directory: e2e
        run: |
          for attempt in 1 2; do
            status=0
            timeout 3m npx playwright install-deps "$BROWSER" || status=$?
            if [ "$status" -eq 0 ]; then exit 0; fi
            echo "::warning::Attempt $attempt of 2 to install the system packages failed (exit $status; 124 = stopped after 3 minutes)"
            sudo dpkg --configure -a
          done
          exit 1
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Start E2E stack
        working-directory: e2e
        run: npm run stack:up
      - name: Playwright (${{ matrix.project }})
        working-directory: e2e
        run: npx playwright test --project="$PROJECT"
        env:
          PROJECT: ${{ matrix.project }}
      - name: Collect stack logs
        if: failure()
        run: $COMPOSE logs --no-color > e2e/compose.log 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/compose.log
          retention-days: 14
      - name: Stop E2E stack
        if: always()
        working-directory: e2e
        run: npm run stack:down

  # The required check "6. E2E + a11y": green only when every browser project passed. `always()`
  # matters: a skipped required check would count as passed.
  e2e-result:
    name: 6. E2E + a11y
    needs: e2e
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All browser projects passed
        env:
          RESULT: ${{ needs.e2e.result }}
        run: |
          echo "Browser projects: $RESULT"
          test "$RESULT" = "success"

  invariants:
    name: 7. Invariant gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: CLIENT/CLIENT.ProcureAccess/.nvmrc
      # Reads the catalogue from the highest docs/TESTING_v<n>.md (TESTING §8.3).
      - name: Invariant gate
        run: node scripts/check-invariants.mjs

  coverage:
    name: 8. Coverage report
    needs: [build, dotnet-tests, client-tests]
    # Also after failed tests (partial report), but not without a build: then stages 3–5 are
    # skipped and there is nothing to merge (#106). A skipped job counts as passed for the ruleset;
    # the failed build blocks the merge.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    # Reported, not gated (TESTING §8.4).
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # Only the inputs of stages 3–5, not this job's own coverage-report of an earlier attempt (#104).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-{ProcureAccess.Tests.*,client}
          path: coverage
      - name: Merge coverage (ReportGenerator)
        run: |
          dotnet tool install dotnet-reportgenerator-globaltool --version "$REPORTGENERATOR_VERSION" --tool-path .tools
          .tools/reportgenerator \
            "-reports:coverage/**/*.cobertura*.xml;coverage/**/lcov.info" \
            "-targetdir:coverage-report" \
            "-reporttypes:Html;MarkdownSummaryGithub" \
            "-sourcedirs:CLIENT/CLIENT.ProcureAccess" \
            "-title:ProcureAccess"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          # lcov carries no assembly name, so ReportGenerator lists the Angular client as "Default".
          echo "_\"Default\" is the Angular client (Vitest lcov). Reported, not gated (TESTING §8.4)._" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 14
